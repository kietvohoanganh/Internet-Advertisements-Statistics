name: Full reproducibility run
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Reproduce the public artifacts
        run: |
          make setup
          make download
          make run
          make publish-results
          make check
      - uses: actions/upload-artifact@v7
        with:
          name: verified-results
          path: |
            results/
            README.md
            outputs/run_status.csv
            outputs/run_warnings.csv
            outputs/session_info.txt
          if-no-files-found: error
