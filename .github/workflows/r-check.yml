name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.2'
          use-public-rspm: true
      - name: Run dependency-free parsing and metric checks
        run: Rscript --vanilla tests/smoke_test.R
      - uses: r-lib/actions/setup-renv@v2
      - name: Install dependencies
        run: |
          Rscript scripts/setup.R
          python -m pip install -r requirements.txt
      - name: Unit tests and committed result consistency
        run: |
          make test PYTHON=python
          python scripts/publish_results.py --check
      - name: Isolated integration and export tests
        run: |
          Rscript tests/integration_test.R
          PYTHON=python Rscript tests/benchmark_integration.R
